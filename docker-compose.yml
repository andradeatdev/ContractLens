services:
  db:
    image: pgvector/pgvector:pg16
    container_name: contract-analyzer-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: contract_analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
      target: dev
    container_name: contract-analyzer-api
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: contract_analyzer
      INTERNAL_WEB_URL: http://web:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    develop:
      watch:
        - action: sync
          path: ./api
          target: /app
          ignore:
            - tmp
        - action: rebuild
          path: ./api/go.mod
    volumes:
      - ./api:/app
      - /app/tmp

  web:
    build:
      context: ./web
      target: dev
    container_name: contract-analyzer-web
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      BACKEND_URL: http://api:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  uploads_data:
