version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: contract-analyzer-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: contract_analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
    container_name: contract-analyzer-api
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: contract_analyzer
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NEXT_PUBLIC_APP_URL: http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    develop:
      watch:
        - action: sync
          path: ./api
          target: /app
          ignore:
            - tmp
        - action: rebuild
          path: ./api/go.mod
    volumes:
      - ./api:/app
      - /app/tmp

volumes:
  postgres_data:
  uploads_data:
